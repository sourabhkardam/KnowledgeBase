spring.application.name=spring-data-jpa-practice

server.port=9191

#schema should be present before running the app
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres?currentSchema=spring_data_jpa_practice
spring.datasource.username=postgres
spring.datasource.password=welcome
spring.datasource.driver-class-name=org.postgresql.Driver